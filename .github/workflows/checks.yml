# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: backend tests
        run: |
          python -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt
          python -m pytest -q
  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: frontend build
        run: |
          npm ci
          npm run lint
          npm run build
